  const SHAPE = { hillfort: 'tri', settlement: 'circ', cemetery: 'sq', find: 'dia' };
  const CFG = {
    milo: { G: window.MILOGRAD, cb: 'lyrMilo', box: 'miloLegend', pane: 'milo', z: 640, anchor: ARCH.miloAnchor, head: 'aMiloH', note: 'aMiloNote', COL: ARCH.milo },
    zar: { G: window.ZARUBINTSY, cb: 'lyrZar', box: 'zarLegend', pane: 'zar', z: 641, anchor: ARCH.zarAnchor, head: 'aZarH', note: 'aZarNote', COL: ARCH.zar },
  };
  const loc = () => (LANG === 'ru' ? 'ru-RU' : 'en-GB');
  function sitePopup(p) {
    const sig = p.prec !== 'village' && p.sigma_m ? ' (σ ≈ ' + Math.round(p.sigma_m).toLocaleString(loc()) + (LANG === 'ru' ? ' м)' : ' m)') : '';
    const nm = p.name_be || p.name_ru || p.village;
    const cult = (p.other_cultures || '').split(/;\s*/).filter(Boolean).map(c => t('c_' + c)).join(', ');
    return '<b>' + esc(nm) + '</b>' + (p.name_ru && p.name_ru !== nm ? ' <span class="muted">(' + esc(p.name_ru) + ')</span>' : '') +
      '<br>' + t('t_' + p.type) + ' · <b>' + t('s_' + p.strength) + '</b>' +
      (cult ? '<br>' + t('aOther') + ': ' + esc(cult) : '') +
      (p.also_milograd ? '<br>' + t('aAlsoMilo') : '') +
      '<br>' + esc(p.village) + (p.district ? ', ' + esc(p.district) + (p.country === 'Belarus' || !p.country ? ' ' + t('aRaion') : '') : '') + ', ' + esc(p.region) +
      '<br><span class="muted">' + t('aSource') + ': ' + esc(p.vol) + ', ' + t('aArt') + ' ' + esc(p.art) + (p.leaf ? ', ' + t('aLeaf') + ' ' + esc(p.leaf) : '') + '</span>' +
      '<br><span class="muted">' + t('aPos') + ': ' + t('pos_' + p.prec) + sig + '</span>' +
      '<br><span class="muted">' + t('aNotModel') + '</span>';
  }
  function siteLayer(c) {
    if (!c.G) return null;
    if (!map.getPane(c.pane)) { map.createPane(c.pane); map.getPane(c.pane).style.zIndex = c.z; }
    return L.geoJSON(c.G, {
      pointToLayer: (f, ll) => {
        const p = f.properties, rough = p.prec === 'village' || !p.sigma_m || p.sigma_m > 1500;
        return L.marker(ll, { pane: c.pane, keyboard: true, title: p.name_be || p.name_ru || p.village || '',
          icon: L.divIcon({ className: '', html: svg(SHAPE[p.type] || 'circ', c.COL[p.strength] || '#888', rough), iconSize: [ARCH.px, ARCH.px], iconAnchor: c.anchor }) });
      },
      onEachFeature: (f, l) => l.bindPopup(() => sitePopup(f.properties), { maxWidth: 330 })
    });
  }
  function siteLegend(c) {
    const el = document.getElementById(c.box); if (!el || !c.G) return;
    el.innerHTML = t(c.head) + ' ' +
      Object.entries(c.COL).map(([k, col]) => '<span style="display:inline-block;margin-right:6px">' + svg('circ', col, false, 16) + ' ' + t('s_' + k) + '</span>').join(' ') + '<br>' +
      Object.entries(SHAPE).map(([k, s]) => '<span style="display:inline-block;margin-right:6px">' + svg(s, '#cfcfcf', false, 16) + ' ' + t('t_' + k) + '</span>').join(' ') +
      '<br><span class="muted">' + t(c.note) + ' (' + c.G.features.length + ')</span>';
  }

  // ---- modern rivers and canals (OpenStreetMap, ODbL): today's network for orientation, lazy-loaded on first use ----
  const RIVX = (function () {
    const RW = { 1: 3.2, 2: 2.2, 3: 1.3, 4: 0.9 }, RMINZ = { 1: 0, 2: 0, 3: 7.5, 4: 9 }, RCOL = '#1565c0', CCOL = '#0a2a66';
    let rnd = null, riv = null, can = null, rivCas = null, canCas = null, busy = 0, lastBand = null;
    const loaded = {};
    function load(src, v) {
      if (window[v]) return Promise.resolve(window[v]);
      if (!loaded[src]) loaded[src] = new Promise((ok, no) => {
        const s = document.createElement('script'); s.src = src; s.onload = () => ok(window[v]); s.onerror = () => no(new Error(src)); document.head.appendChild(s);
      });
      return loaded[src];
    }
    const kmTxt = p => (p.km ? ', ' + t('rivKm', { km: LANG === 'ru' ? String(p.km).replace('.', ',') : p.km }) : '');
    const tip = (p, kind) => (p.n ? '<b>' + esc(p.n) + '</b><br>' : '') + esc(kind) + kmTxt(p) + '<br><span class="muted">' + t('rivTip') + '</span>';
    function pane() {
      if (!map.getPane('riv')) { map.createPane('riv'); map.getPane('riv').style.zIndex = 380; }
      if (!rnd) rnd = L.canvas({ pane: 'riv', padding: 0.3 });
    }
    function mkRivers(G) {
      const opt = (f, cas) => ({ pane: 'riv', renderer: rnd, interactive: !cas, color: cas ? '#ffffff' : RCOL, opacity: cas ? 0.55 : 0.95,
        weight: RW[f.properties.c] + (cas ? 1.8 : 0), lineCap: 'round', lineJoin: 'round' });
      const filt = f => map.getZoom() >= RMINZ[f.properties.c];
      rivCas = L.geoJSON(G, { style: f => opt(f, true), filter: filt });
      riv = L.geoJSON(G, { style: f => opt(f, false), filter: filt, onEachFeature: (f, l) => l.bindTooltip(() => tip(f.properties, t('rivC' + f.properties.c)), { sticky: true }) });
    }
    function mkCanals(G) {
      canCas = L.geoJSON(G, { style: f => ({ pane: 'riv', renderer: rnd, interactive: false, color: '#ffffff', opacity: 0.6, weight: (f.properties.c === 1 ? 1.6 : 1.1) + 1.6 }) });
      can = L.geoJSON(G, { style: f => ({ pane: 'riv', renderer: rnd, color: CCOL, opacity: 0.95, weight: f.properties.c === 1 ? 1.6 : 1.1, dashArray: f.properties.c === 1 ? '6 3' : '3 3' }),
        onEachFeature: (f, l) => l.bindTooltip(() => tip(f.properties, f.properties.c === 1 ? t('rivCanal') : t('w_' + f.properties.w)), { sticky: true }) });
    }
    const off = l => { if (l && map.hasLayer(l)) map.removeLayer(l); };
    const el = id => document.getElementById(id);
    async function sync() {
      const me = ++busy, cbM = el('lyrRiv'), cbR = el('lyrRivR'), cbC = el('lyrRivC');
      const wantR = cbM.checked && cbR.checked, wantC = cbM.checked && cbC.checked;
      cbR.disabled = cbC.disabled = !cbM.checked;
      if (wantR || wantC) pane();
      try {
        if (wantR && !riv) mkRivers(await load('rivers_data.js?v=' + V_RIV, 'RIVERS'));
        if (wantC && !can) mkCanals(await load('canals_data.js?v=' + V_CAN, 'CANALS'));
      } catch (e) { console.warn(t('rivFail'), e.message); }
      if (me !== busy) return;
      [rivCas, riv, canCas, can].forEach(off);
      if (wantC && can) { canCas.addTo(map); can.addTo(map); }
      if (wantR && riv) { rivCas.addTo(map); riv.addTo(map); }
    }
    function init() {
      ['lyrRiv', 'lyrRivR', 'lyrRivC'].forEach(id => el(id).addEventListener('change', sync));
      map.on('zoomend', () => {
        const z = map.getZoom(), band = Object.values(RMINZ).filter(m => z >= m).length;
        if (band === lastBand || !riv) { lastBand = band; return; }
        lastBand = band; [rivCas, riv].forEach(off); riv = null; mkRivers(window.RIVERS); sync();
      });
      sync();
    }
    function legend() {
      const d = el('rivLegend'); if (!d) return;
      const ln = (w, c, dash) => '<svg width="28" height="10" style="vertical-align:middle" aria-hidden="true"><line x1="2" y1="5" x2="26" y2="5" stroke="#fff" stroke-opacity="0.7" stroke-width="' + (w + 1.8) + '"/><line x1="2" y1="5" x2="26" y2="5" stroke="' + c + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/></svg>';
      const it = (svgS, k) => '<span style="display:inline-block;margin-right:6px">' + svgS + ' ' + t(k) + '</span>';
      d.innerHTML = t('rivH') + ' ' + [it(ln(3.2, RCOL), 'rivC1'), it(ln(2.2, RCOL), 'rivC2'), it(ln(1.3, RCOL), 'rivC3'), it(ln(0.9, RCOL), 'rivC4'),
        it(ln(1.6, CCOL, '6 3'), 'rivCanal'), it(ln(1.1, CCOL, '3 3'), 'rivDrain')].join(' ') + '<br><span class="muted">' + t('rivNote') + '</span>';
    }
    return { init: init, legend: legend };
  })();

  function applyLang() {
    document.documentElement.lang = LANG;
    document.title = t('title');
    const md = document.querySelector('meta[name=description]'); if (md) md.setAttribute('content', t('desc'));
    document.querySelectorAll('[data-ia]').forEach(e => e.setAttribute('aria-label', t(e.dataset.ia)));
    document.querySelectorAll('[data-i]').forEach(e => { e.innerHTML = t(e.dataset.i); });
    document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
    document.getElementById('back').href = 'https://paleoeurope.com/polesie-mires/?lang=' + LANG;
    document.getElementById('nFrames').textContent = t('frames', { n: M.epochs.length });
    const tg = document.getElementById('tglBody'); tg.textContent = t('settings') + (document.getElementById('ctrl').classList.contains('collapsed') ? ' ▸' : ' ▾');
    siteLegend(CFG.milo); siteLegend(CFG.zar); RIVX.legend();
    skillTable();
    if (map) map.closePopup();
  }

  function start() {
    hist = { broad: {}, narrow: {} };
    Object.entries(M.overlays.hist).forEach(([k, o]) => { hist.broad[k] = overlay(o.url, o.bounds, { opacity: 0.9, pane: 'ov', interactive: false }); });
    Object.entries(MN.overlays.hist).forEach(([k, o]) => { hist.narrow[k] = overlay(o.url, o.bounds, { opacity: 0.9, pane: 'ov', interactive: false }); });
    locLayer = L.layerGroup(M.locations.map(l => L.circleMarker([l.lat, l.lon], { radius: 7, color: '#b3261e', weight: 2, fillColor: '#fff', fillOpacity: 0.9 }).bindPopup(() => locPopup(l), { maxWidth: 320 })));
    cal = L.geoJSON(M.calib_polygons, { style: { color: '#d02090', weight: 2, fill: false, dashArray: '4 3' },
      onEachFeature: (f, l) => l.bindPopup(() => '<b>' + t('cal_' + f.properties.name) + '</b><br>' + t('calPop', { a: Math.round(f.properties.area_in_domain_km2).toLocaleString(LANG === 'ru' ? 'ru-RU' : 'en-GB') })) });
    milo = siteLayer(CFG.milo); zar = siteLayer(CFG.zar);
    [['lyrMilo', milo], ['lyrZar', zar]].forEach(([id, lay]) => {
      const cb = document.getElementById(id); if (!lay) { cb.disabled = true; return; }
      const sync = () => { if (cb.checked) lay.addTo(map); else map.removeLayer(lay); };
      cb.addEventListener('change', sync); sync();
    });
    if (OG) { document.getElementById('lyrPts').checked = false; }
    const own = ['lyrMilo', 'lyrZar', 'lyrRiv', 'lyrRivR', 'lyrRivC'];
    document.querySelectorAll('#ctrl input').forEach(el => { if (own.indexOf(el.id) < 0) el.addEventListener('input', update); });
    RIVX.init();
    document.getElementById('legToggle').addEventListener('click', e => { e.preventDefault(); document.getElementById('legend').classList.toggle('show'); });
    const ctrl = document.getElementById('ctrl');
    if (window.innerWidth < 640) ctrl.classList.add('collapsed');
    document.getElementById('tglBody').addEventListener('click', () => { ctrl.classList.toggle('collapsed'); applyLang(); });
    document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
      LANG = b.dataset.l;
      try { const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u); } catch (e) { /* ignore */ }
      applyLang(); update();
    }));
    applyLang(); update();
  }
  // tiny lossless WebP probe (works in Safari, unlike canvas.toDataURL)
  const probe = new Image();
  probe.onload = () => { WEBP = probe.width === 1; start(); };
  probe.onerror = () => { WEBP = false; start(); };
  probe.src = 'data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==';
})();
</script>
</body>
</html>
